<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Forkop — список доменов</title>
<style>
*{box-sizing:border-box}
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
body{margin:0;background:#0f1115;color:#f4f6f8}
main{max-width:760px;margin:auto;padding:14px 12px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:23px;margin:0;font-weight:700}
.sub{color:#9da4b0;font-size:13px;margin-top:3px}
.card{background:#181b22;border:1px solid #2b3039;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 3px 15px rgba(0,0,0,.12)}
.row{display:flex;gap:8px}
.row>*{min-width:0}
input,button,textarea{font:inherit;border-radius:11px;border:1px solid #3a404b}
input,textarea{background:#101218;color:#fff;padding:11px 12px;outline:none}
input:focus,textarea:focus{border-color:#5b89ff}
button{padding:10px 13px;background:#2f6df6;color:white;border:0;cursor:pointer;font-weight:600}
button.secondary{background:#30343d}
button.danger{background:#a33f48}
button.ghost{background:#242831}
button:disabled{opacity:.55;cursor:default}
.add input{flex:1}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.search{width:100%}
.status{min-height:19px;margin-top:9px;font-size:13px;color:#aeb5c0}
.status.ok{color:#7fe0a8}.status.err{color:#ff9199}.status.warn{color:#ffd27d}
.count{font-size:13px;color:#9da4b0;margin:7px 2px 0}
.list{max-height:58vh;overflow:auto;margin-top:8px}
.item{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid #282c34}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:18px;height:18px;accent-color:#4d7fff}
.domain{flex:1;overflow-wrap:anywhere;font-size:14px}
.item button{padding:7px 10px;font-size:13px}
.empty{padding:28px 10px;text-align:center;color:#8e96a4}
.tokenBox summary{cursor:pointer;color:#cbd1da;font-weight:600}
.tokenBox .body{padding-top:10px}
.note{font-size:12px;line-height:1.4;color:#8f97a4;margin-top:7px}
details{border-top:1px solid #282c34;padding-top:10px;margin-top:10px}
textarea{width:100%;min-height:150px;resize:vertical}
@media(max-width:600px){
  main{padding-top:10px}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .searchWrap{grid-column:1/-1}
  .toolbar button{width:100%}
  .add .addBtn{width:105px}
}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Forkop — домены</h1>
    <div class="sub">nektopandroid-source/forkop-list · domain.txt</div>
  </div>
  <button id="refresh" class="ghost" title="Обновить">↻</button>
</header>

<section class="card">
  <div class="row add">
    <input id="newDomain" autocomplete="off" placeholder="example.com">
    <button id="addBtn" class="addBtn">Добавить</button>
  </div>

  <div class="toolbar" style="margin-top:9px">
    <div class="searchWrap"><input id="search" class="search" placeholder="Поиск по списку"></div>
    <button id="deleteSelected" class="danger" disabled>Удалить выбранные</button>
    <button id="save" disabled>Сохранить</button>
  </div>

  <div id="count" class="count">Не загружено</div>
  <div id="status" class="status"></div>
  <div id="list" class="list"></div>
</section>

<section class="card">
  <details>
    <summary>Добавить несколько доменов сразу</summary>
    <div style="margin-top:10px">
      <textarea id="bulk" placeholder="youtube.com&#10;googlevideo.com&#10;ytimg.com"></textarea>
      <button id="bulkAdd" style="margin-top:8px;width:100%">Добавить из текста</button>
    </div>
  </details>
</section>

<section class="card tokenBox">
  <details>
    <summary>GitHub Token</summary>
    <div class="body">
      <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
      <div class="row">
        <button id="saveToken" style="margin-top:8px;flex:1">Сохранить Token</button>
        <button id="clearToken" class="secondary" style="margin-top:8px">Очистить</button>
      </div>
      <div class="note">Токен сохраняется только в этом браузере. Нужен Fine-grained token с доступом только к репозиторию forkop-list и правом Contents → Read and write.</div>
    </div>
  </details>
</section>
</main>

<script>
const OWNER = "nektopandroid-source";
const REPO = "forkop-list";
const PATH = "domain.txt";
const BRANCH = "main";

let domains = [];
let originalText = "";
let fileSha = null;
let dirty = false;

const $ = id => document.getElementById(id);

function setStatus(text, type="") {
  $("status").textContent = text;
  $("status").className = "status " + type;
}

function normalizeDomain(value) {
  let d = value.trim().toLowerCase();
  d = d.replace(/^https?:\/\//, "");
  d = d.split("/")[0];
  d = d.replace(/^www\./, "");
  d = d.replace(/\.$/, "");
  return d;
}

function validDomain(d) {
  return /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i.test(d);
}

function getToken() {
  return localStorage.getItem("forkop_github_token") || "";
}

async function github(url, options={}) {
  const token = getToken();
  if (!token) throw new Error("Нет GitHub Token. Откройте раздел «GitHub Token» ниже.");
  const headers = {
    Accept: "application/vnd.github+json",
    Authorization: "Bearer " + token,
    "X-GitHub-Api-Version": "2022-11-28",
    ...(options.headers || {})
  };
  const r = await fetch(url, {...options, headers});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) throw new Error("GitHub Token недействителен или просрочен.");
    if (r.status === 403) throw new Error("GitHub отклонил запрос. Проверьте Contents → Read and write.");
    if (r.status === 404) throw new Error("GitHub не нашёл domain.txt или токен не имеет доступа к репозиторию.");
    if (r.status === 409) throw new Error("Файл изменили на GitHub с другого устройства. Нажмите «Обновить» и повторите.");
    throw new Error(data.message || ("GitHub HTTP " + r.status));
  }
  return data;
}

function decodeBase64Utf8(s) {
  const bin = atob(s.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function encodeBase64Utf8(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function loadDomains(showMessage=true) {
  $("refresh").disabled = true;
  setStatus("Загружаю список…");
  try {
    const file = await github(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}`);
    fileSha = file.sha;
    originalText = decodeBase64Utf8(file.content);
    domains = [...new Set(originalText.split(/\r?\n/).map(normalizeDomain).filter(Boolean))].sort();
    dirty = false;
    render();
    if (showMessage) setStatus("Список обновлён.", "ok");
    $("save").disabled = true;
  } catch (e) {
    setStatus(e.message, "err");
  } finally {
    $("refresh").disabled = false;
  }
}

function markDirty() {
  dirty = true;
  $("save").disabled = false;
}

function addOne(value) {
  const d = normalizeDomain(value);
  if (!d) return {ok:false, msg:"Пустой домен"};
  if (!validDomain(d)) return {ok:false, msg:`Некорректный домен: ${d}`};
  if (domains.includes(d)) return {ok:false, duplicate:true, msg:`Уже есть: ${d}`};
  domains.push(d);
  domains.sort((a,b)=>a.localeCompare(b));
  markDirty();
  return {ok:true, msg:`Добавлен: ${d}`};
}

function removeDomain(d) {
  domains = domains.filter(x => x !== d);
  markDirty();
  render();
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const shown = domains.filter(d => d.includes(q));
  $("count").textContent = `Всего: ${domains.length} · показано: ${shown.length}` + (dirty ? " · есть несохранённые изменения" : "");
  $("list").innerHTML = "";
  if (!shown.length) {
    $("list").innerHTML = '<div class="empty">Ничего не найдено</div>';
  } else {
    const frag = document.createDocumentFragment();
    for (const d of shown) {
      const row = document.createElement("div");
      row.className = "item";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.dataset.domain = d;
      cb.className = "select";

      const span = document.createElement("div");
      span.className = "domain";
      span.textContent = d;

      const btn = document.createElement("button");
      btn.className = "danger";
      btn.textContent = "Удалить";
      btn.addEventListener("click", () => {
        removeDomain(d);
        setStatus(`Удалён: ${d}. Нажмите «Сохранить».`, "warn");
      });

      row.append(cb, span, btn);
      frag.appendChild(row);
    }
    $("list").appendChild(frag);
  }
  updateSelectionButton();
}

function updateSelectionButton() {
  const n = document.querySelectorAll(".select:checked").length;
  $("deleteSelected").disabled = n === 0;
  $("deleteSelected").textContent = n ? `Удалить выбранные (${n})` : "Удалить выбранные";
}

async function saveDomains() {
  if (!fileSha) {
    await loadDomains(false);
    if (!fileSha) return;
  }
  $("save").disabled = true;
  setStatus("Сохраняю в GitHub…");
  const content = domains.join("\n") + (domains.length ? "\n" : "");
  try {
    await github(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        message: "Update Forkop domain list",
        content: encodeBase64Utf8(content),
        sha: fileSha,
        branch: BRANCH
      })
    });
    originalText = content;
    dirty = false;
    await loadDomains(false);
    setStatus("✓ Сохранено в GitHub.", "ok");
  } catch(e) {
    $("save").disabled = false;
    setStatus(e.message, "err");
  }
}

$("addBtn").addEventListener("click", () => {
  const r = addOne($("newDomain").value);
  if (r.ok) {
    $("newDomain").value = "";
    render();
    setStatus(r.msg + ". Нажмите «Сохранить».", "ok");
  } else {
    setStatus(r.msg, r.duplicate ? "warn" : "err");
  }
});
$("newDomain").addEventListener("keydown", e => {
  if (e.key === "Enter") $("addBtn").click();
});
$("bulkAdd").addEventListener("click", () => {
  const lines = $("bulk").value.split(/\r?\n|[,;]+/).map(x=>x.trim()).filter(Boolean);
  let added=0, skipped=0, bad=0;
  for (const line of lines) {
    const r=addOne(line);
    if(r.ok) added++;
    else if(r.duplicate) skipped++;
    else bad++;
  }
  $("bulk").value="";
  render();
  setStatus(`Добавлено: ${added} · уже были: ${skipped} · ошибочных: ${bad}`, added ? "ok" : "warn");
});
$("deleteSelected").addEventListener("click", () => {
  const selected = [...document.querySelectorAll(".select:checked")].map(x=>x.dataset.domain);
  if (!selected.length) return;
  if (!confirm(`Удалить ${selected.length} домен(ов) из списка?`)) return;
  const set = new Set(selected);
  domains = domains.filter(d=>!set.has(d));
  markDirty();
  render();
  setStatus(`Удалено: ${selected.length}. Нажмите «Сохранить».`, "warn");
});
$("search").addEventListener("input", render);
$("list").addEventListener("change", updateSelectionButton);
$("refresh").addEventListener("click", () => loadDomains(true));
$("save").addEventListener("click", saveDomains);

$("saveToken").addEventListener("click", async () => {
  const t=$("token").value.trim();
  if(!t) { setStatus("Введите GitHub Token.", "err"); return; }
  localStorage.setItem("forkop_github_token", t);
  setStatus("Token сохранён. Проверяю доступ…");
  await loadDomains(true);
});
$("clearToken").addEventListener("click", () => {
  localStorage.removeItem("forkop_github_token");
  $("token").value="";
  domains=[];
  fileSha=null;
  $("save").disabled=true;
  render();
  setStatus("Token удалён из браузера.", "ok");
});

$("token").value = getToken();
render();
if (getToken()) loadDomains(true);
else setStatus("Укажите GitHub Token, чтобы загрузить список.", "warn");
</script>
</body>
</html>
